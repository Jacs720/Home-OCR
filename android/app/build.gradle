import java.security.MessageDigest

plugins {
    id 'com.android.application'
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin') {
            details.useVersion '1.8.22'
            details.because 'Evita mezclar kotlin-stdlib 1.8 con jdk7/jdk8 1.6 de dependencias transitivas.'
        }
    }
}

android {
    namespace 'com.baidu.paddle.lite.demo.ocr'
    compileSdk 35
    ndkVersion '21.4.7075529'

    defaultConfig {
        applicationId 'com.jacar.pokemonhomeocr'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '0.6.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -frtti -fexceptions -Wno-format'
                arguments '-DANDROID_PLATFORM=android-23',
                        '-DANDROID_STL=c++_shared',
                        '-DANDROID_ARM_NEON=TRUE'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.10.2'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        aidl true
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        // El binario de Paddle Lite incluido solo se distribuye para arm64-v8a.
        disable 'ChromeOsAbiSupport'
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

def archives = [
        [
                src : 'https://paddleocr.bj.bcebos.com/libs/paddle_lite_libs_v2_10.tar.gz',
                dest: 'PaddleLite'
        ],
        [
                src : 'https://paddlelite-demo.bj.bcebos.com/libs/android/opencv-4.2.0-android-sdk.tar.gz',
                dest: 'OpenCV'
        ],
        [
                src : 'https://paddleocr.bj.bcebos.com/PP-OCRv2/lite/ch_PP-OCRv2.tar.gz',
                dest: 'src/main/assets/models'
        ],
        [
                src : 'https://paddleocr.bj.bcebos.com/dygraph_v2.0/lite/ch_dict.tar.gz',
                dest: 'src/main/assets/labels'
        ]
]

tasks.register('downloadAndExtractArchives') {
    group = 'paddle'
    description = 'Downloads Paddle Lite, OpenCV and the mobile OCR models.'

    doLast {
        file('cache').mkdirs()

        archives.each { archive ->
            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            digest.update(archive.src.bytes)
            String cacheName = new BigInteger(1, digest.digest()).toString(16)
            File archiveFile = file("cache/${cacheName}.tar.gz")

            if (!archiveFile.exists()) {
                ant.get(src: archive.src, dest: archiveFile)
            }

            if (!file(archive.dest).exists()) {
                copy {
                    from tarTree(resources.gzip(archiveFile))
                    into archive.dest
                }
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('downloadAndExtractArchives')
}
